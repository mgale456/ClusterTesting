min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/clusters/main/talos/generated/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/clusters/main/talos/generated/talosconfig"

[tools]
#uv = "0.12.13"                       # required:template
age = "1.3.2"
#cloudflared = "2026.9.1"
flux2 = "2.9.5"
gh = "2.100.0"
gum = "2.0.1"
helm = "4.3.0"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.34.0"
kustomize = "5.8.1"
#lefthook = "2.1.12"
#node = "24.21.0"
oxfmt = "0.67.0"
sd = "1.1.0"                         # required:template
sops = "3.13.3"
talosctl = "1.13.7"
#"github:postfinance/topf" = "v0.6.0"
yq = "4.53.6"
#zizmor = "1.30.1"
k9s = "0.51.0"

[settings]
lockfile_platforms = ["linux-x64"]

