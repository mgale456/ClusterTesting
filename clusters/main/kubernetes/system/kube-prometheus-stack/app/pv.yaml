apiVersion: v1
kind: PersistentVolume
metadata:
  name: "prom-pv"
  labels:
    app.kubernetes.io/name: prom-pv
spec:
  capacity:
    storage: 75Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: miroir-local
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: miroir.home-operations.com
    fsType: ext4
    volumeHandle: prom-pv
