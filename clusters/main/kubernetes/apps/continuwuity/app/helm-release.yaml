---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: continuwuity
  namespace: continuwuity
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: ${TZ}
    image:
      repository: forgejo.ellis.link/continuwuation/continuwuity
      tag: v26.6.2-maxperf@sha256:080802be0cb0051825fabedc694e43a3384d0cabbe428dcf4c58acd3428d8d86
    workload:
      main:
        enabled: true
        primary: true
        type: StatefulSet
        replicas: 1
        strategy: OnDelete
        podSpec:
          containers:
            main:
              enabled: true
              primary: true
              env:
                CONTINUWUITY_CONFIG: /config/config.toml
    service:
      main:
        ports:
          main:
            enabled: true
            port: 80
            targetPort: 8080
            protocol: http

    persistence:
      data:
        enabled: true
        type: pvc
        mountPath: /data
      backups:
        enabled: true
        type: nfs
        mountPath: /backups
        path: /mnt/MainPool/appsnfs/continuwuity
        server: ${TRUENAS_EXTERNAL_IP}
      config:
        enabled: true
        type: configmap
        mountPath: /config/config.toml
        subPath: config.toml
        readOnly: true
        objectName: continuwuity-config
        optional: true
        expandObjectName: false
    configmap:
      continuwuity-conf:
        enabled: true
        data:
          config.toml: |
            [global.well_known]
            rtc_focus_server_urls = [{ type = "livekit", livekit_service_url = "https://livekit.${INGRESS_URL}" },]
