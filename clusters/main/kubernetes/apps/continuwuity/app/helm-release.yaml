---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: continuwuity
  namespace: continuwuity
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.15
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: ${TZ}
    image:
      repository: forgejo.ellis.link/continuwuation/continuwuity
      tag: v26.9.1-maxperf@sha256:14689dfb874405bd72e3b84bf5d394d2ab6a1bb959ff9d458af0ca5a373dafed
    workload:
      main:
        enabled: true
        primary: true
        type: StatefulSet
        replicas: 1
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              enabled: true
              primary: true
              env:
                CONTINUWUITY_CONFIG: /config/config.toml
    service:
      main:
        ports:
          main:
            enabled: true
            port: 80
            targetPort: 8080
            protocol: http

    persistence:
      data:
        enabled: true
        type: pvc
        mountPath: /data
      backups:
        enabled: true
        type: nfs
        mountPath: /backups
        path: /mnt/MainPool/appsnfs/continuwuity
        server: ${TRUENAS_EXTERNAL_IP}
      config:
        enabled: true
        type: configmap
        mountPath: /config/config.toml
        subPath: config.toml
        readOnly: true
        objectName: continuwuity-config
        optional: true
        expandObjectName: false
