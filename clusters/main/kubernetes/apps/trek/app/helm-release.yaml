---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
  namespace: trek
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.16.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: ${TZ}
    podOptions:
      hostUsers: true
    securityContext:
      container:
        PUID: 1000
        runAsUser: 1000
        runAsGroup: 1000
      pod:
        fsGroup: 1000
    image:
      repository: mauriceboe/trek
      tag: 3.4.1@sha256:ce7fab639b89a6f62d484d1175a7d489a536a8c77291f56c03fec20608d4a3eb
    workload:
      main:
        enabled: true
        primary: true
        type: Deployment
        replicas: 1
        podSpec:
          containers:
            main:
              #command: ["dumb-init", "--"]
              #args: ["node", "--import", "tsx", "src/index.ts"]
              args:
                - sh
                - -c
                - cd /app/server && exec node --require tsconfig-paths/register
                  dist/index.js
              enabled: true
              primary: true
              env:
                NODE_ENV: production
                PORT: 3000
                ENCRYPTION_KEY: temp3be5919fda2ddbe3c7e95dd2694cc79576ea92f4d153d607c00bf641a3d9 # generate with: openssl rand -hex 32
                LOG_LEVEL: info
                ALLOWED_ORIGINS: https://trek.${DOMAIN_0}
                APP_URL: https://trek.${DOMAIN_0}
                TRUST_PROXY: 1
                DEFAULT_LANGUAGE: en
                OIDC_ISSUER: https://auth.${DOMAIN_0}
                OIDC_CLIENT_ID: ${TREK_OIDC_CLIENT_ID}
                OIDC_CLIENT_SECRET: ${TREK_OIDC_CLIENT_SECRET}
                OIDC_DISPLAY_NAME: Authelia
                OIDC_SCOPE: openid email profile groups
                OIDC_ADMIN_CLAIM: groups
                OIDC_ADMIN_VALUE: lldap_admin

              probes:
                liveness:
                  enabled: true
                  type: http
                  port: 3000
                  path: /api/health
                readiness:
                  enabled: true
                  type: http
                  port: 3000
                  path: /api/health
                startup:
                  enabled: true
                  type: http
                  port: 3000
                  path: /api/health


    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            protocol: http
            port: 3000
    persistence:
      db:
        enabled: true
        type: pvc
        mountPath: /app/data
      logs:
        enabled: true
        type: pvc
        mountPath: /app/data/logs
      uploads:
        enabled: true
        type: pvc
        mountPath: /app/uploads
